name: Build CustomBanner Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v3

      - name: Checkout Aliucord
        uses: actions/checkout@v3
        with:
          repository: Aliucord/Aliucord
          path: Aliucord

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x Aliucord/gradlew

      - name: Copy plugin into Aliucord plugins dir
        run: |
          mkdir -p Aliucord/plugins
          cp -r . Aliucord/plugins/CustomBanner

      - name: Build Plugin
        run: |
          cd Aliucord
          ./gradlew :plugins:CustomBanner:make

      - name: Upload Plugin ZIP
        uses: actions/upload-artifact@v3
        with:
          name: CustomBanner-plugin
          path: Aliucord/plugins/CustomBanner/build/CustomBanner.zip
          if-no-files-found: error
